<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGA-CODE-4</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="mega-header">
      <div class="brand">
        <div class="brand-mark" aria-label="Logo MEGA-CODE-4">M4</div>
        <div class="brand-copy">
          <div class="brand-name">MEGA-CODE-4</div>
          <div class="brand-subtitle">Portable Cyber Coding Agent</div>
        </div>
      </div>

      <div class="status-strip" aria-live="polite">
        <span class="badge neutral"><span class="dot"></span> Status: carregando</span>
      </div>
    </header>

    <main class="content">
      <section class="panel">
        <h1>Dashboard de Operação Segura</h1>
        <p>Portal local do agente MEGA-CODE-4. A API exige Bearer Token e o servidor escuta apenas em 127.0.0.1. O estado dos serviços MCP aparece como "unknown" enquanto não houver verificação real.</p>
        <form id="token-form" autocomplete="off" style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;">
          <input id="token-input" type="password" placeholder="Cole o token exibido no terminal" aria-label="Token do dashboard" style="flex:1;min-width:220px;padding:0.6rem 0.8rem;border-radius:10px;border:1px solid rgba(105,240,255,0.3);background:rgba(255,255,255,0.04);color:inherit;" />
          <button type="submit" style="padding:0.6rem 1.1rem;border-radius:10px;border:1px solid rgba(105,240,255,0.45);background:rgba(105,240,255,0.12);color:inherit;cursor:pointer;">Conectar</button>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
